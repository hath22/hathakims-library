<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hathakims Library</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css?v=14" />
</head>
<body data-page="library">

  <header>
    <div class="header-inner">
      <div class="logo" onclick="switchPage('library')" style="cursor:pointer">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="6" fill="#7C3AED"/>
          <path d="M8 8h4v12H8zM12 14l8-6v12l-8-6z" fill="white"/>
        </svg>
        <span>Hathakims Library</span>
      </div>
      <nav id="typeNav" class="header-nav">
        <button class="nav-btn active" data-filter-type="all">All</button>
        <button class="nav-btn" data-filter-type="movie">Movies</button>
        <button class="nav-btn" data-filter-type="tv">TV Shows</button>
        <button class="nav-btn" data-filter-type="arwen">Arwen</button>
        <span class="nav-divider"></span>
        <button class="nav-btn" id="listsPageBtn">☰ Lists</button>
      </nav>
    </div>
  </header>
  <div id="toast" class="toast" style="display:none"></div>

  <!-- ── Library Page ─────────────────────────────────────── -->
  <main id="libraryPage">
    <div class="lists-page-header">
      <h2 class="lists-page-title" id="libraryPageTitle">My Library</h2>
      <div class="library-page-actions">
        <button class="sync-btn" id="syncAll" title="Refresh all entries from IMDB">↻ Sync IMDB</button>
        <button class="add-btn" id="openModal">+ Add Title</button>
      </div>
    </div>
    <section class="stats-bar" id="statsBar"></section>

    <section class="controls">
      <div class="controls-top">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="6.5" cy="6.5" r="4.5" stroke="#888" stroke-width="1.5"/>
            <path d="M10 10l3.5 3.5" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search titles, genres, cast…" />
          <button class="clear-search" id="clearSearch" style="display:none">✕</button>
        </div>
        <div class="filters">
          <select id="filterRating">
            <option value="">Any IMDB Rating</option>
            <option value="9">9+</option>
            <option value="8">8+</option>
            <option value="7">7+</option>
            <option value="6">6+</option>
          </select>
          <select id="sortBy">
            <option value="dateAdded">Date Added</option>
            <option value="title">Title A–Z</option>
            <option value="year">Year</option>
            <option value="rating">Rating</option>
          </select>
        </div>
      </div>
      <div id="genreTags" class="genre-tags"></div>
    </section>

    <div id="activeFilters" class="active-filters"></div>
    <div id="resultCount" class="result-count"></div>

    <div id="grid" class="grid"></div>
    <div id="empty" class="empty-state" style="display:none">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="28" stroke="#333" stroke-width="2"/>
        <path d="M22 26h20M22 32h14M22 38h8" stroke="#555" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>No titles match your filters.</p>
      <button onclick="resetFilters()">Clear filters</button>
    </div>
  </main>

  <!-- ── Lists Page ──────────────────────────────────────── -->
  <main id="listsPage" style="display:none">
    <div class="lists-page-header">
      <h2 class="lists-page-title">My Lists</h2>
      <button class="add-btn" id="newListBtn">+ New List</button>
    </div>
    <div id="listsGrid" class="lists-grid"></div>
    <div id="listsEmpty" class="empty-state" style="display:none">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <rect x="12" y="10" width="40" height="44" rx="4" stroke="#333" stroke-width="2"/>
        <path d="M20 22h24M20 30h24M20 38h16" stroke="#555" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>No lists yet.</p>
      <button onclick="promptNewList()">Create your first list</button>
    </div>
  </main>

  <!-- ── List Detail Page ───────────────────────────────── -->
  <main id="listDetailPage" style="display:none">
    <div class="list-detail-header">
      <button class="back-btn" onclick="switchPage('lists')">← Lists</button>
      <h1 id="listDetailName" class="list-detail-title"></h1>
      <div class="list-detail-actions">
        <button class="btn-secondary" id="renameListBtn">✎ Rename</button>
        <button class="btn-secondary btn-danger" id="deleteListBtn">Delete List</button>
      </div>
    </div>
    <div id="listDetailGrid" class="grid"></div>
    <div id="listDetailEmpty" class="empty-state" style="display:none">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="28" stroke="#333" stroke-width="2"/>
        <path d="M22 32h20M32 22v20" stroke="#555" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>No titles in this list yet.<br>Go to Library and use the <strong>☰</strong> button on any card.</p>
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div id="modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Title</h2>
        <button class="modal-close" id="closeModal">✕</button>
      </div>
      <form id="addForm">
        <input type="hidden" id="editId" />
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label>Title *</label>
            <input type="text" id="f-title" required placeholder="e.g. Inception" />
          </div>
          <div class="form-group">
            <label>Type *</label>
            <select id="f-type" required>
              <option value="movie">Movie</option>
              <option value="tv">TV Show</option>
              <option value="arwen">Arwen</option>
            </select>
          </div>
        </div>
        <div class="imdb-fetch-row">
          <button type="button" class="imdb-fetch-btn" id="fetchIMDB">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M7 4v3.5l2 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            Fetch from IMDB
          </button>
          <span id="imdbStatus" class="imdb-status"></span>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Year</label>
            <input type="number" id="f-year" placeholder="2024" min="1900" max="2030" />
          </div>
          <div class="form-group">
            <label>Genre</label>
            <input type="text" id="f-genre" placeholder="e.g. Sci-Fi, Thriller" />
          </div>
          <div class="form-group">
            <label>Rating (0–10)</label>
            <input type="number" id="f-rating" placeholder="8.5" min="0" max="10" step="0.1" />
          </div>
        </div>
        <div class="form-group">
          <label>Director / Creator</label>
          <input type="text" id="f-creator" placeholder="e.g. Christopher Nolan" />
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="f-notes" rows="3" placeholder="Your thoughts, memorable quotes…"></textarea>
        </div>
        <div class="form-group">
          <label>Poster URL (optional)</label>
          <input type="url" id="f-poster" placeholder="https://…" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancelModal">Cancel</button>
          <button type="button" class="btn-secondary" id="modalSyncIMDB" style="display:none">↻ Sync IMDB</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="modal-overlay" style="display:none">
    <div class="modal modal-detail">
      <button class="modal-close" id="closeDetail">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="data.js?v=5"></script>
  <script src="app.js?v=22"></script>
</body>
</html>
